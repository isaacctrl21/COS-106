<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Circle -->
  <circle cx="120" cy="120" r="110" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="3" filter="url(#shadow)"/>
  
  <!-- Outer Tech Ring -->
  <circle cx="120" cy="120" r="102" fill="none" stroke="#38bdf8" stroke-dasharray="6,6" stroke-width="1.5" opacity="0.6"/>

  <!-- User Silhouette -->
  <!-- Body / Shoulders -->
  <path d="M55 198 C55 160 82 148 120 148 C158 148 185 160 185 198 Z" fill="#e2e8f0"/>
  <!-- Cyber Jacket Accent -->
  <path d="M85 158 L120 182 L155 158 L170 198 L70 198 Z" fill="#0284c7" opacity="0.85"/>
  <path d="M110 180 L120 200 L130 180 Z" fill="#38bdf8"/>
  
  <!-- Neck -->
  <rect x="108" y="130" width="24" height="22" rx="4" fill="#cbd5e1"/>
  
  <!-- Head -->
  <ellipse cx="120" cy="100" rx="34" ry="40" fill="#f1f5f9"/>
  <!-- Hair -->
  <path d="M86 95 C86 65 100 55 120 55 C140 55 154 65 154 95 C146 75 136 70 120 70 C104 70 94 75 86 95 Z" fill="#0f172a"/>
  
  <!-- Cyber Glasses / Visor -->
  <rect x="94" y="92" width="22" height="12" rx="3" fill="#0284c7" opacity="0.9"/>
  <rect x="124" y="92" width="22" height="12" rx="3" fill="#0284c7" opacity="0.9"/>
  <line x1="116" y1="98" x2="124" y2="98" stroke="#38bdf8" stroke-width="2"/>
  
  <!-- Security Shield Badge -->
  <g transform="translate(160, 160)">
    <circle cx="20" cy="20" r="24" fill="#0f172a" stroke="#38bdf8" stroke-width="2"/>
    <path d="M20 10 L30 14 V22 C30 28 20 33 20 33 C20 33 10 28 10 22 V14 Z" fill="#0ea5e9"/>
    <path d="M17 21 L19 23 L24 17" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>